name: 'Continuous Integration'

on:
  push:
    branches: ['dev', 'main']
  pull_request:
    branches: ['dev', 'main']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 'Lint & Typecheck (baseline gates)'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # node-install runs prisma:generate through `with:env` (dotenv), which
      # expects .env to exist — same pattern as upstream's own workflows.
      - name: Copy env
        run: cp .env.example .env

      - uses: ./.github/actions/node-install

      - name: "Biome check (baseline-count gate: 5 errors / 842 warnings)"
        run: node scripts/ci-biome-baseline.cjs

      - name: "TypeScript (known-errors allowlist: 3 Prisma-drift files)"
        run: node scripts/ci-tsc-allowlist.cjs

  e2e:
    name: 'E2E (Playwright, zero secrets)'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: documenso
          POSTGRES_PASSWORD: password
          POSTGRES_DB: documenso
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready -U documenso -d documenso"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      inbucket:
        image: inbucket/inbucket
        ports:
          - 9000:9000
          - 2500:2500

    env:
      # Dev-style env with ZERO real secrets. Upload transport = database,
      # email = Inbucket mail-catcher container, local-file signing cert from
      # the repo's example assets, local jobs. Nothing outbound is possible:
      # no Stripe, no OAuth, no SES, no S3.
      NEXTAUTH_SECRET: 'e2e-test-secret-not-real'
      NEXT_PRIVATE_ENCRYPTION_KEY: 'CAFEBABE'
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: 'DEADBEEF'
      NEXT_PRIVATE_DATABASE_URL: 'postgres://documenso:password@localhost:54320/documenso'
      NEXT_PRIVATE_DIRECT_DATABASE_URL: 'postgres://documenso:password@localhost:54320/documenso'
      NEXT_PUBLIC_UPLOAD_TRANSPORT: 'database'
      NEXT_PRIVATE_SIGNING_TRANSPORT: 'local'
      # Read with fs.readFileSync relative to process.cwd() — the app runs with
      # cwd = apps/remix (see the start step), same as upstream Docker's
      # WORKDIR /app/apps/remix. So this is apps/remix/example/cert.p12.
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: './example/cert.p12'
      NEXT_PRIVATE_JOBS_PROVIDER: 'local'
      NEXT_PRIVATE_SMTP_TRANSPORT: 'smtp-auth'
      NEXT_PRIVATE_SMTP_HOST: 'localhost'
      NEXT_PRIVATE_SMTP_PORT: '2500'
      NEXT_PRIVATE_SMTP_USERNAME: 'documenso'
      NEXT_PRIVATE_SMTP_PASSWORD: 'password'
      NEXT_PRIVATE_SMTP_FROM_NAME: 'NorthSign CI'
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: 'noreply@ci.northsign.test'
      NEXT_PUBLIC_WEBAPP_URL: 'http://localhost:3000'
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: 'http://localhost:3000'
      NEXT_PRIVATE_GOOGLE_CLIENT_ID: ''
      NEXT_PRIVATE_GOOGLE_CLIENT_SECRET: ''
      NEXT_PRIVATE_MICROSOFT_CLIENT_ID: ''
      NEXT_PRIVATE_MICROSOFT_CLIENT_SECRET: ''
      DANGEROUS_BYPASS_RATE_LIMITS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Copy env
        run: cp .env.example .env

      - uses: ./.github/actions/node-install

      - name: Apply database migrations
        run: npm run prisma:migrate-deploy

      - name: Build the app (production server)
        run: npm run build -w @documenso/remix

      - name: Start the app (cwd apps/remix, like upstream Docker)
        run: |
          cd apps/remix
          # Static assets (serveStatic root 'build/client'), the local signing
          # certificate, and the PDF-certificate logo all resolve relative to
          # process.cwd() — which must be apps/remix. Upstream's Dockerfile does
          # `WORKDIR /app/apps/remix` before `node build/server/main.js`; the
          # workspace start script runs with the same cwd. Running it from the
          # repo root silently breaks all client JS (assets 404 into the SSR
          # router → no hydration → dialogs/locale switching dead).
          PORT=3000 NODE_ENV=production node build/server/main.js > /tmp/app.log 2>&1 &
          echo $! > /tmp/app.pid

      - name: Poll /api/health until ready
        run: |
          set -e
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:3000/api/health || true)
            if [ "$code" = "200" ]; then
              echo "App ready after ${i} attempt(s): $(cat /tmp/health.json)"
              exit 0
            fi
            echo "Attempt ${i}/60: HTTP ${code} — retrying in 5s"
            sleep 5
          done
          echo 'App failed to become healthy within 5 minutes. Last log lines:'
          tail -n 100 /tmp/app.log || true
          exit 1

      - name: Guard - client JS assets must be served as static files
        run: |
          set -e
          entry=$(find apps/remix/build/client/assets -name 'index-*.js' | head -n 1)
          if [ -z "$entry" ]; then
            echo 'No built client entry asset found under apps/remix/build/client/assets'
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000/assets/$(basename "$entry")")
          if [ "$code" != "200" ]; then
            echo "Client asset /assets/$(basename "$entry") returned HTTP $code."
            echo 'Static assets are being handled by the SSR router instead of serveStatic —'
            echo 'the server was almost certainly started from the wrong working directory.'
            tail -n 100 /tmp/app.log || true
            exit 1
          fi
          echo "Client asset served correctly: HTTP $code"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run NorthSign E2E tests
        run: npx playwright test --config packages/app-tests/northsign.playwright.config.ts

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: |
            packages/app-tests/test-results/**
            packages/app-tests/playwright-report/**
            /tmp/app.log
          retention-days: 7
